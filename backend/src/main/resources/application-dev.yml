spring:
  datasource:
    url: jdbc:h2:mem:schoolerp_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS identity\;CREATE SCHEMA IF NOT EXISTS institution\;CREATE SCHEMA IF NOT EXISTS admissions\;CREATE SCHEMA IF NOT EXISTS students\;CREATE SCHEMA IF NOT EXISTS academics\;CREATE SCHEMA IF NOT EXISTS staff\;CREATE SCHEMA IF NOT EXISTS attendance\;CREATE SCHEMA IF NOT EXISTS examinations\;CREATE SCHEMA IF NOT EXISTS finance\;CREATE SCHEMA IF NOT EXISTS communication\;CREATE SCHEMA IF NOT EXISTS operations\;CREATE SCHEMA IF NOT EXISTS system
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.schoolerp: INFO
    org.springframework.security: WARN

